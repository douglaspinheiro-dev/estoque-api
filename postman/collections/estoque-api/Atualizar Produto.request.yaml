$kind: http-request
name: Atualizar Produto
method: PUT
url: '{{base_url}}/produtos/:id'
order: 3000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '1'
    description: 'ID do produto a ser atualizado'
body:
  type: json
  content: |-
    {
      "nome": "Produto Atualizado",
      "quantidade": 20,
      "preco": 49.90
    }
